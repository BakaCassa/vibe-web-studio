env:
  RSS_URLS: |
    https://www.google.com/alerts/feeds/02437803316835037950/14970927714122536608
    https://www.google.com/alerts/feeds/02437803316835037950/524016075232281448

name: Update Google Alerts News

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes before generating file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: Fetch multiple RSS and generate merged news.json
        run: |
          python3 - << 'EOF'
          import os, json, re, html, urllib.request, urllib.parse, difflib
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          raw_urls = os.environ.get("RSS_URLS", "")
          urls = [u.strip() for u in raw_urls.splitlines() if u.strip()]

          all_items = []

          def find_first(element, tags, ns):
              for tag in tags:
                  found = element.find(tag, ns)
                  if found is not None:
                      return found
              return None

          def get_text(element):
              if element is None:
                  return ""
              return "".join(element.itertext())

          def clean_text(raw):
              if not raw:
                  return ""
              text = html.unescape(raw)
              text = re.sub(r"<[^>]+>", "", text)
              text = html.unescape(text)
              return re.sub(r"\s+", " ", text).strip()

          def normalize_title(title):
              """移除各家媒體後綴（如 - 自由時報、| ETtoday）與標點符號，以利比對相似度"""
              t = re.sub(r'[\-|–|—|\|].*?$', '', title)
              return re.sub(r'[^\w\s]', '', t).strip().lower()

          def is_similar(t1, t2, threshold=0.55):
              """計算兩則標題的相似度比例（0.0 ~ 1.0）"""
              n1 = normalize_title(t1)
              n2 = normalize_title(t2)
              # 若其中一方短標題完全包含在另一方，直接視為重複
              if len(n1) > 6 and len(n2) > 6:
                  if n1 in n2 or n2 in n1:
                      return True
              return difflib.SequenceMatcher(None, n1, n2).ratio() >= threshold

          def unwrap_google_url(url):
              if not url:
                  return "#"
              try:
                  parsed = urllib.parse.urlparse(url)
                  qs = urllib.parse.parse_qs(parsed.query)
                  if "url" in qs and qs["url"]:
                      return qs["url"][0]
              except Exception:
                  pass
              return url

          for rss_url in urls:
              try:
                  req = urllib.request.Request(rss_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      xml_data = resp.read()

                  root = ET.fromstring(xml_data)
                  ns = {"atom": "http://www.w3.org/2005/Atom"}
                  entries = root.findall("atom:entry", ns)
                  if not entries:
                      entries = root.findall(".//item")

                  for entry in entries:
                      title_el = find_first(entry, ["atom:title", "title"], ns)
                      raw_title = get_text(title_el)
                      title = clean_text(raw_title) if raw_title else "無標題"

                      link = "#"
                      link_el = entry.find("atom:link", ns)
                      if link_el is not None and "href" in link_el.attrib:
                          link = unwrap_google_url(link_el.attrib["href"])
                      else:
                          le = entry.find("link")
                          if le is not None and le.text:
                              link = unwrap_google_url(le.text.strip())

                      date_el = find_first(entry, ["atom:published", "atom:updated", "pubDate"], ns)
                      pub_date = (date_el.text.strip()[:10] if (date_el is not None and date_el.text) else "")

                      content_el = find_first(entry, ["atom:content", "atom:summary", "description"], ns)
                      summary = clean_text(get_text(content_el))

                      all_items.append({
                          "title": title,
                          "link": link,
                          "date": pub_date,
                          "summary": summary
                      })
              except Exception as e:
                  print(f"Error fetching {rss_url}: {e}")

          # 先依照發布日期降序排序（讓最新的優先被納入）
          all_items.sort(key=lambda x: x["date"], reverse=True)

          # 去重過濾：如果這則新聞與已經收錄的新聞相似度過高，就跳過
          deduped_items = []
          for item in all_items:
              if any(is_similar(item["title"], kept["title"]) for kept in deduped_items):
                  continue
              deduped_items.append(item)
              if len(deduped_items) >= 15:
                  break

          tw_tz = timezone(timedelta(hours=8))
          payload = {
              "updatedAt": datetime.now(tw_tz).strftime("%Y-%m-%d %H:%M:%S"),
              "items": deduped_items
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit and push news.json
        run: |
          git add news.json
          git diff --staged --quiet || git commit -m "chore: update deduplicated news.json"
          git push origin HEAD:main
