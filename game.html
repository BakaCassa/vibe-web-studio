<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>霓虹乒乓 Pong</title>
  <style>
    :root {
      --pink: #ff2bd6;
      --cyan: #21f6ff;
      --purple: #8c4dff;
      --bg: #080014;
      --panel: rgba(12, 3, 28, 0.78);
      --text: #f6eaff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
        system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 32%, rgba(140, 77, 255, 0.20), transparent 34%),
        linear-gradient(#090014, #13001f 62%, #06000c);
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: none;
    }

    /* Synthwave 背景：遠方太陽 + 透視網格 */
    body::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 17%;
      width: min(48vw, 430px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.00) 0 9%,
          rgba(255, 43, 214, 0.42) 9.3% 10.3%
        ),
        linear-gradient(to bottom, #ffb0ef, #ff3b94 48%, #ff0d57 100%);
      box-shadow:
        0 0 35px rgba(255, 43, 214, 0.55),
        0 0 100px rgba(255, 43, 214, 0.20);
      opacity: 0.75;
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      left: -10vw;
      right: -10vw;
      bottom: -5vh;
      height: 53vh;
      background:
        linear-gradient(rgba(33, 246, 255, 0.12) 1px, transparent 1px) 0 0 / 100% 35px,
        linear-gradient(90deg, rgba(140, 77, 255, 0.16) 1px, transparent 1px) 0 0 / 55px 100%;
      transform: perspective(280px) rotateX(62deg);
      transform-origin: bottom;
      mask-image: linear-gradient(to top, #000, transparent 92%);
      -webkit-mask-image: linear-gradient(to top, #000, transparent 92%);
      z-index: -2;
    }

    a.home-link {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.03em;
      padding: 8px 12px;
      border: 1px solid rgba(33, 246, 255, 0.65);
      border-radius: 999px;
      background: rgba(3, 0, 15, 0.58);
      box-shadow:
        0 0 12px rgba(33, 246, 255, 0.28),
        inset 0 0 12px rgba(33, 246, 255, 0.08);
      transition: 0.18s ease;
    }

    a.home-link:hover {
      color: var(--cyan);
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .game-shell {
      width: min(94vw, 1120px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .topbar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 6px;
    }

    .score-card {
      min-width: 0;
      padding: 9px 14px;
      border: 1px solid rgba(255, 43, 214, 0.42);
      border-radius: 14px;
      background: var(--panel);
      box-shadow:
        0 0 16px rgba(255, 43, 214, 0.18),
        inset 0 0 12px rgba(255, 43, 214, 0.05);
      backdrop-filter: blur(8px);
    }

    .score-card.right {
      text-align: right;
      border-color: rgba(33, 246, 255, 0.42);
      box-shadow:
        0 0 16px rgba(33, 246, 255, 0.16),
        inset 0 0 12px rgba(33, 246, 255, 0.05);
    }

    .score-label {
      display: block;
      font-size: 12px;
      opacity: 0.72;
      margin-bottom: 1px;
    }

    .score-value {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 12px currentColor;
    }

    .score-card.left .score-value {
      color: var(--pink);
    }

    .score-card.right .score-value {
      color: var(--cyan);
    }

    .title {
      font-size: clamp(20px, 4vw, 33px);
      font-weight: 1000;
      text-align: center;
      letter-spacing: 0.16em;
      margin-left: 0.16em;
      text-shadow:
        0 0 9px rgba(255, 43, 214, 0.75),
        0 0 20px rgba(33, 246, 255, 0.28);
      white-space: nowrap;
    }

    .best {
      justify-self: end;
      font-size: clamp(12px, 2vw, 15px);
      color: #dbcfff;
      text-align: right;
    }

    .best strong {
      color: #fff;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.65);
    }

    .canvas-wrap {
      width: 100%;
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,43,214,.85), rgba(33,246,255,.85));
      box-shadow:
        0 0 30px rgba(255, 43, 214, 0.20),
        0 0 45px rgba(33, 246, 255, 0.10);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: rgba(4, 0, 12, 0.94);
    }

    .overlay {
      position: absolute;
      inset: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      border-radius: 18px;
      background: rgba(4, 0, 14, 0.55);
      backdrop-filter: blur(3px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity .2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(88%, 500px);
      padding: clamp(20px, 4vw, 36px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 43, 214, 0.13),
          rgba(33, 246, 255, 0.08)
        ),
        rgba(9, 1, 22, 0.88);
      box-shadow:
        0 0 35px rgba(255,43,214,.22),
        inset 0 0 28px rgba(33,246,255,.05);
    }

    .overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 46px);
      text-shadow: 0 0 18px rgba(255,43,214,.75);
    }

    .overlay p {
      margin: 7px 0;
      color: #d8cced;
      font-size: clamp(14px, 2.4vw, 18px);
    }

    .result {
      margin: 16px 0 20px;
      font-size: clamp(18px, 3.2vw, 25px);
    }

    .result b {
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(33,246,255,.72);
    }

    .start-button,
    .touch-button {
      border: 0;
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2bd6, #813cff 50%, #21f6ff);
      box-shadow:
        0 0 14px rgba(255,43,214,.45),
        0 0 30px rgba(33,246,255,.18);
    }

    .start-button {
      padding: 12px 24px;
      min-width: 180px;
      border-radius: 999px;
      font-size: clamp(16px, 2.7vw, 20px);
      transition: transform .15s ease, filter .15s ease;
    }

    .start-button:hover {
      transform: translateY(-2px) scale(1.015);
      filter: brightness(1.12);
    }

    .start-button:active {
      transform: scale(.98);
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      opacity: .70;
      line-height: 1.6;
    }

    .mobile-controls {
      width: 100%;
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 0 6px;
    }

    .touch-button {
      min-height: 55px;
      border-radius: 16px;
      font-size: 25px;
      background:
        linear-gradient(180deg, rgba(24, 8, 45, 0.98), rgba(10, 1, 22, 0.98));
      border: 1px solid rgba(255,255,255,.16);
      color: #fef7ff;
      box-shadow:
        0 0 15px rgba(255,43,214,.12),
        inset 0 0 12px rgba(33,246,255,.04);
      touch-action: none;
    }

    .touch-button.active,
    .touch-button:active {
      background: linear-gradient(135deg, rgba(255,43,214,.55), rgba(33,246,255,.3));
      box-shadow:
        0 0 18px rgba(255,43,214,.38),
        0 0 22px rgba(33,246,255,.18);
      transform: translateY(1px);
    }

    .status {
      min-height: 18px;
      text-align: center;
      font-size: 12px;
      opacity: .70;
      letter-spacing: .05em;
    }

    @media (max-width: 700px) {
      .game-shell {
        width: min(96vw, 700px);
        gap: 9px;
      }

      .topbar {
        grid-template-columns: 1fr auto 1fr;
        gap: 5px;
      }

      .score-card {
        padding: 7px 9px;
        border-radius: 11px;
      }

      .best {
        font-size: 11px;
      }

      .title {
        font-size: clamp(15px, 4.2vw, 22px);
        letter-spacing: .10em;
        margin-left: .10em;
      }

      .canvas-wrap {
        border-radius: 14px;
      }

      canvas {
        border-radius: 12px;
      }

      .overlay {
        border-radius: 12px;
      }

      .mobile-controls {
        display: grid;
      }

      .status {
        display: none;
      }
    }

    @media (max-height: 700px) and (min-width: 701px) {
      .game-shell {
        transform: scale(.92);
      }
    }
  </style>
</head>
<body>
  <a class="home-link" href="index.html">← 回首頁</a>

  <main class="game-shell" aria-label="霓虹乒乓遊戲">
    <div class="topbar">
      <div class="score-card left">
        <span class="score-label">玩家</span>
        <span id="playerScore" class="score-value">0</span>
      </div>

      <div class="title">NEON PONG</div>

      <div class="score-card right">
        <span class="score-label">最高分</span>
        <span id="bestScore" class="score-value">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" aria-label="Pong 遊戲畫面"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h1 id="overlayTitle">霓虹乒乓</h1>
          <p id="overlayText">接住球，讓它不要越過你的球拍！</p>
          <div class="result" id="resultText"></div>
          <button id="startButton" class="start-button">開始遊戲</button>
          <div class="hint">
            電腦：← → 移動球拍・空白鍵開始／重新開始<br>
            手機：使用下方觸控按鈕
          </div>
        </div>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="touch-button" data-action="left" aria-label="向左移動">←</button>
      <button class="touch-button" data-action="start" aria-label="開始或重新開始">●</button>
      <button class="touch-button" data-action="right" aria-label="向右移動">→</button>
    </div>

    <div id="status" class="status">準備就緒</div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const playerScoreEl = document.getElementById("playerScore");
      const bestScoreEl = document.getElementById("bestScore");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const resultText = document.getElementById("resultText");
      const startButton = document.getElementById("startButton");
      const statusEl = document.getElementById("status");

      const STORAGE_KEY = "neonPongBestScore";

      // 遊戲邏輯座標固定為 1200×675，畫面只做縮放。
      const WORLD_W = 1200;
      const WORLD_H = 675;

      const player = {
        x: WORLD_W / 2 - 70,
        y: WORLD_H - 42,
        w: 140,
        h: 14,
        speed: 760
      };

      const enemy = {
        x: WORLD_W / 2 - 70,
        y: 28,
        w: 140,
        h: 14,
        speed: 430
      };

      const ball = {
        x: WORLD_W / 2,
        y: WORLD_H / 2,
        r: 9,
        vx: 0,
        vy: 0,
        baseSpeed: 470,
        maxSpeed: 920
      };

      let score = 0;
      let bestScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
      let running = false;
      let gameOver = false;
      let lastTime = 0;
      let serveTimer = 0;
      let flashTimer = 0;

      const keys = {
        left: false,
        right: false
      };

      bestScoreEl.textContent = bestScore;

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        ctx.setTransform(canvas.width / WORLD_W, 0, 0, canvas.height / WORLD_H, 0, 0);
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function resetBall(direction = Math.random() > 0.5 ? 1 : -1) {
        ball.x = WORLD_W / 2;
        ball.y = WORLD_H / 2;
        const angle = (Math.random() * 0.9 - 0.45);
        const speed = ball.baseSpeed + Math.min(score * 10, 190);
        ball.vx = Math.sin(angle) * speed;
        ball.vy = direction * Math.cos(angle) * speed;
      }

      function resetGame() {
        score = 0;
        player.x = WORLD_W / 2 - player.w / 2;
        enemy.x = WORLD_W / 2 - enemy.w / 2;
        flashTimer = 0;
        serveTimer = 0;
        gameOver = false;
        running = true;
        playerScoreEl.textContent = score;
        overlay.classList.add("hidden");
        statusEl.textContent = "遊戲中";
        resetBall(1);
      }

      function endGame() {
        running = false;
        gameOver = true;

        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem(STORAGE_KEY, String(bestScore));
          bestScoreEl.textContent = bestScore;
        }

        overlayTitle.textContent = "遊戲結束";
        overlayText.textContent = "球越過你的球拍了！";
        resultText.innerHTML = `本局分數：<b>${score}</b>　最高分：<b>${bestScore}</b>`;
        startButton.textContent = "重新開始";
        overlay.classList.remove("hidden");
        statusEl.textContent = "按空白鍵或按下重新開始";
      }

      function startFromOverlay() {
        overlayTitle.textContent = "霓虹乒乓";
        overlayText.textContent = "接住球，讓它不要越過你的球拍！";
        resultText.textContent = "";
        startButton.textContent = "開始遊戲";
        resetGame();
      }

      function serve() {
        if (serveTimer > 0) return;
        serveTimer = 0.55;
        resetBall(ball.vy >= 0 ? 1 : -1);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function movePaddles(dt) {
        if (keys.left) player.x -= player.speed * dt;
        if (keys.right) player.x += player.speed * dt;
        player.x = clamp(player.x, 24, WORLD_W - player.w - 24);

        // 簡單 AI：追球，但保留一些反應時間，遊戲不會變成必輸。
        const target = ball.x - enemy.w / 2;
        const diff = target - enemy.x;
        const aiSpeed = enemy.speed + Math.min(score * 8, 210);
        const step = clamp(diff, -aiSpeed * dt, aiSpeed * dt);
        enemy.x = clamp(enemy.x + step, 24, WORLD_W - enemy.w - 24);
      }

      function paddleCollision(pad, movingDown) {
        const hitsX = ball.x + ball.r > pad.x && ball.x - ball.r < pad.x + pad.w;
        const hitsY = movingDown
          ? ball.y + ball.r >= pad.y && ball.y < pad.y + pad.h
          : ball.y - ball.r <= pad.y + pad.h && ball.y > pad.y;

        return hitsX && hitsY;
      }

      function bounceFromPaddle(pad, movingDown) {
        const hit = (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2);
        const clampedHit = clamp(hit, -1, 1);

        let speed = Math.hypot(ball.vx, ball.vy);
        speed = Math.min(speed * 1.045 + 4, ball.maxSpeed);

        const angle = clampedHit * 0.95;
        const nextVx = Math.sin(angle) * speed;
        const nextVy = Math.cos(angle) * speed * (movingDown ? -1 : 1);

        ball.vx = nextVx;
        ball.vy = nextVy;

        ball.y = movingDown
          ? pad.y - ball.r - 0.5
          : pad.y + pad.h + ball.r + 0.5;

        flashTimer = 0.11;
      }

      function update(dt) {
        if (!running) return;

        serveTimer = Math.max(0, serveTimer - dt);
        flashTimer = Math.max(0, flashTimer - dt);

        movePaddles(dt);

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // 左右牆反彈。
        if (ball.x - ball.r <= 14) {
          ball.x = 14 + ball.r;
          ball.vx = Math.abs(ball.vx);
        } else if (ball.x + ball.r >= WORLD_W - 14) {
          ball.x = WORLD_W - 14 - ball.r;
          ball.vx = -Math.abs(ball.vx);
        }

        // 敵方球拍。
        if (ball.vy < 0 && paddleCollision(enemy, false)) {
          bounceFromPaddle(enemy, false);
        }

        // 玩家球拍。
        if (ball.vy > 0 && paddleCollision(player, true)) {
          score += 1;
          playerScoreEl.textContent = score;

          // 達到新高分時立即更新顯示與儲存。
          if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          }

          bounceFromPaddle(player, true);
        }

        // 球越過玩家底線：遊戲結束。
        if (ball.y - ball.r > WORLD_H + 12) {
          endGame();
          return;
        }

        // 球越過敵方底線：算作一次成功防守，讓球重新發球。
        if (ball.y + ball.r < -12) {
          score += 1;
          playerScoreEl.textContent = score;

          if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          }

          resetBall(-1);
          flashTimer = 0.12;
        }
      }

      function glowCircle(x, y, radius, colorA, colorB) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, radius * 4);
        g.addColorStop(0, colorA);
        g.addColorStop(0.25, colorB);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, radius * 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBackground() {
        const bg = ctx.createLinearGradient(0, 0, 0, WORLD_H);
        bg.addColorStop(0, "#080013");
        bg.addColorStop(0.55, "#10001c");
        bg.addColorStop(1, "#04000a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        // 中央發光分界線。
        ctx.save();
        ctx.setLineDash([14, 16]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 43, 214, .48)";
        ctx.shadowBlur = 13;
        ctx.shadowColor = "#ff2bd6";
        ctx.beginPath();
        ctx.moveTo(28, WORLD_H / 2);
        ctx.lineTo(WORLD_W - 28, WORLD_H / 2);
        ctx.stroke();
        ctx.restore();

        // 遊戲區邊框。
        ctx.save();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(33, 246, 255, .45)";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#21f6ff";
        ctx.strokeRect(14, 14, WORLD_W - 28, WORLD_H - 28);
        ctx.restore();

        // 微弱掃描線。
        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = "#fff";
        for (let y = 0; y < WORLD_H; y += 7) {
          ctx.fillRect(14, y, WORLD_W - 28, 1);
        }
        ctx.restore();
      }

      function drawPaddle(pad, mainColor, glowColor) {
        const gradient = ctx.createLinearGradient(pad.x, pad.y, pad.x + pad.w, pad.y);
        gradient.addColorStop(0, mainColor);
        gradient.addColorStop(0.5, "#ffffff");
        gradient.addColorStop(1, mainColor);

        ctx.save();
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 24;
        ctx.shadowColor = glowColor;
        ctx.beginPath();
        ctx.roundRect(pad.x, pad.y, pad.w, pad.h, 7);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.fillRect(pad.x + 12, pad.y + 3, pad.w - 24, 2);
        ctx.restore();
      }

      function drawBall() {
        glowCircle(ball.x, ball.y, ball.r, "rgba(255,255,255,.85)", "rgba(33,246,255,.22)");

        ctx.save();
        const g = ctx.createRadialGradient(
          ball.x - 2, ball.y - 2, 1,
          ball.x, ball.y, ball.r
        );
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.5, "#e8ffff");
        g.addColorStop(1, "#21f6ff");
        ctx.fillStyle = g;
        ctx.shadowBlur = 22;
        ctx.shadowColor = "#21f6ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        drawBackground();

        if (flashTimer > 0) {
          ctx.save();
          ctx.globalAlpha = flashTimer * 2.4;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(14, 14, WORLD_W - 28, WORLD_H - 28);
          ctx.restore();
        }

        drawPaddle(enemy, "#ff2bd6", "#ff2bd6");
        drawPaddle(player, "#21f6ff", "#21f6ff");
        drawBall();

        if (!running && !gameOver) {
          ctx.save();
          ctx.textAlign = "center";
          ctx.font = "800 28px sans-serif";
          ctx.fillStyle = "rgba(255,255,255,.82)";
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#8c4dff";
          ctx.fillText("READY", WORLD_W / 2, WORLD_H / 2 + 105);
          ctx.restore();
        }
      }

      function frame(time) {
        if (!lastTime) lastTime = time;
        const dt = Math.min((time - lastTime) / 1000, 0.033);
        lastTime = time;

        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function setKey(code, pressed) {
        if (code === "ArrowLeft") keys.left = pressed;
        if (code === "ArrowRight") keys.right = pressed;
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "ArrowLeft" || event.code === "ArrowRight" || event.code === "Space") {
          event.preventDefault();
        }

        if (event.code === "ArrowLeft") keys.left = true;
        if (event.code === "ArrowRight") keys.right = true;

        if (event.code === "Space" && !event.repeat) {
          if (running) {
            // 遊戲進行中按空白鍵：立刻發球，避免空白鍵失去作用。
            serve();
          } else {
            startFromOverlay();
          }
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "ArrowLeft") keys.left = false;
        if (event.code === "ArrowRight") keys.right = false;
      });

      startButton.addEventListener("click", startFromOverlay);

      // 手機觸控按鈕：按住左右鍵即可持續移動。
      document.querySelectorAll(".touch-button").forEach((button) => {
        const action = button.dataset.action;

        const press = (event) => {
          event.preventDefault();
          button.classList.add("active");

          if (action === "left") keys.left = true;
          if (action === "right") keys.right = true;

          if (action === "start") {
            if (!running) startFromOverlay();
            else serve();
          }
        };

        const release = (event) => {
          event.preventDefault();
          button.classList.remove("active");

          if (action === "left") keys.left = false;
          if (action === "right") keys.right = false;
        };

        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          keys.left = false;
          keys.right = false;
        }
      });

      // 初始畫面。
      overlay.classList.remove("hidden");
      overlayTitle.textContent = "霓虹乒乓";
      overlayText.textContent = "接住球，讓它不要越過你的球拍！";
      resultText.textContent = "";
      statusEl.textContent = "準備就緒";
      resetBall(1);
      draw();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
