<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>霓虹乒乓 Pong</title>
  <style>
    :root {
      --pink: #ff2bd6;
      --cyan: #21f6ff;
      --purple: #8c4dff;
      --gold: #ffd23f;
      --bg: #080014;
      --panel: rgba(12, 3, 28, 0.82);
      --text: #f6eaff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 僅允許輸入框可選取文字 */
    input {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    body {
      font-family:
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
        system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 32%, rgba(140, 77, 255, 0.20), transparent 34%),
        linear-gradient(#090014, #13001f 62%, #06000c);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* Synthwave 背景：遠方太陽 + 透視網格 */
    body::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 17%;
      width: min(48vw, 430px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.00) 0 9%,
          rgba(255, 43, 214, 0.42) 9.3% 10.3%
        ),
        linear-gradient(to bottom, #ffb0ef, #ff3b94 48%, #ff0d57 100%);
      box-shadow:
        0 0 35px rgba(255, 43, 214, 0.55),
        0 0 100px rgba(255, 43, 214, 0.20);
      opacity: 0.72;
      z-index: -3;
    }

    body::after {
      content: "";
      position: fixed;
      left: -10vw;
      right: -10vw;
      bottom: -5vh;
      height: 53vh;
      background:
        linear-gradient(rgba(33, 246, 255, 0.12) 1px, transparent 1px) 0 0 / 100% 35px,
        linear-gradient(90deg, rgba(140, 77, 255, 0.16) 1px, transparent 1px) 0 0 / 55px 100%;
      transform: perspective(280px) rotateX(62deg);
      transform-origin: bottom;
      mask-image: linear-gradient(to top, #000, transparent 92%);
      -webkit-mask-image: linear-gradient(to top, #000, transparent 92%);
      z-index: -2;
    }

    a.home-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 60;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(13px, 1.8vw, 16px);
      letter-spacing: 0.03em;
      padding: 7px 14px;
      border: 1px solid rgba(33, 246, 255, 0.65);
      border-radius: 999px;
      background: rgba(8, 2, 24, 0.85);
      box-shadow:
        0 0 12px rgba(33, 246, 255, 0.28),
        inset 0 0 12px rgba(33, 246, 255, 0.08);
      transition: 0.18s ease;
    }

    a.home-link:hover {
      color: var(--cyan);
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .game-shell {
      width: min(94vw, 1080px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .topbar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }

    .score-card {
      min-width: 0;
      padding: 8px 14px;
      border: 1px solid rgba(255, 43, 214, 0.42);
      border-radius: 14px;
      background: var(--panel);
      box-shadow:
        0 0 16px rgba(255, 43, 214, 0.18),
        inset 0 0 12px rgba(255, 43, 214, 0.05);
      backdrop-filter: blur(8px);
    }

    .score-card.right {
      text-align: right;
      border-color: rgba(33, 246, 255, 0.42);
      box-shadow:
        0 0 16px rgba(33, 246, 255, 0.16),
        inset 0 0 12px rgba(33, 246, 255, 0.05);
    }

    .score-label {
      display: block;
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 2px;
    }

    .score-value {
      font-size: clamp(20px, 3.8vw, 32px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 12px currentColor;
    }

    .score-card.left .score-value {
      color: var(--pink);
    }

    .score-card.right .score-value {
      color: var(--cyan);
    }

    .title {
      font-size: clamp(18px, 3.6vw, 32px);
      font-weight: 1000;
      text-align: center;
      letter-spacing: 0.14em;
      margin-left: 0.14em;
      text-shadow:
        0 0 9px rgba(255, 43, 214, 0.75),
        0 0 20px rgba(33, 246, 255, 0.28);
      white-space: nowrap;
    }

    .canvas-wrap {
      width: 100%;
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,43,214,.85), rgba(33,246,255,.85));
      box-shadow:
        0 0 30px rgba(255, 43, 214, 0.20),
        0 0 45px rgba(33, 246, 255, 0.10);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: rgba(4, 0, 12, 0.94);
    }

    /* 改為全螢幕獨立彈窗，手機與電腦皆可完整舒適瀏覽與填寫資料 */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 56px 16px 20px;
      background: rgba(5, 0, 16, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity .22s ease;
      z-index: 50;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(94vw, 480px);
      max-height: calc(100dvh - 76px);
      overflow-y: auto;
      padding: clamp(18px, 4vw, 28px);
      text-align: center;
      border: 1px solid rgba(33, 246, 255, 0.35);
      border-radius: 22px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 43, 214, 0.16),
          rgba(33, 246, 255, 0.10)
        ),
        rgba(11, 3, 26, 0.96);
      box-shadow:
        0 10px 45px rgba(0, 0, 0, 0.7),
        0 0 35px rgba(255, 43, 214, 0.25),
        inset 0 0 28px rgba(33, 246, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
      touch-action: pan-y;
    }

    .overlay-card::-webkit-scrollbar {
      width: 6px;
    }
    .overlay-card::-webkit-scrollbar-thumb {
      background: rgba(33, 246, 255, 0.4);
      border-radius: 999px;
    }

    .overlay h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
      text-shadow: 0 0 18px rgba(255,43,214,.75);
    }

    .overlay p {
      margin: 0;
      color: #d8cced;
      font-size: clamp(13px, 2.5vw, 15px);
    }

    .result {
      font-size: clamp(17px, 3.5vw, 22px);
      margin: 2px 0;
    }

    .result b {
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(33,246,255,.72);
    }

    /* 上傳分數區塊 */
    .submit-box {
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(33, 246, 255, 0.5);
      background: rgba(16, 4, 38, 0.75);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .submit-box.hidden {
      display: none;
    }

    .input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nickname-input {
      flex: 1;
      min-width: 150px;
      background: rgba(6, 1, 16, 0.9);
      border: 1px solid rgba(255, 43, 214, 0.65);
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      text-align: center;
      transition: box-shadow .2s ease;
    }

    .nickname-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(33, 246, 255, 0.55);
    }

    .submit-btn {
      border: 0;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      font-weight: 800;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(255, 43, 214, 0.4);
      transition: transform .15s ease, filter .15s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      font-size: 13px;
      min-height: 18px;
      color: var(--cyan);
      letter-spacing: .03em;
    }

    /* 雲端排行榜區塊 */
    .leaderboard-panel {
      background: rgba(5, 0, 16, 0.75);
      border: 1px solid rgba(140, 77, 255, 0.4);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 14px;
      font-weight: 800;
      color: #e5d9ff;
    }

    .refresh-btn {
      background: rgba(33, 246, 255, 0.12);
      border: 1px solid rgba(33, 246, 255, 0.35);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--cyan);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: transform .2s ease, background .2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:hover {
      background: rgba(33, 246, 255, 0.25);
      transform: scale(1.05);
    }

    .lb-list {
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 4px;
      touch-action: pan-y;
    }

    .lb-list::-webkit-scrollbar {
      width: 4px;
    }
    .lb-list::-webkit-scrollbar-thumb {
      background: rgba(255, 43, 214, 0.45);
      border-radius: 4px;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 42px 1fr 68px;
      align-items: center;
      padding: 6px 10px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .lb-row.top-1 {
      border-color: rgba(255, 210, 63, 0.65);
      background: rgba(255, 210, 63, 0.12);
      color: var(--gold);
      font-weight: 700;
    }
    .lb-row.top-2 {
      border-color: rgba(33, 246, 255, 0.55);
      background: rgba(33, 246, 255, 0.1);
      color: var(--cyan);
    }
    .lb-row.top-3 {
      border-color: rgba(255, 43, 214, 0.55);
      background: rgba(255, 43, 214, 0.1);
      color: var(--pink);
    }

    .lb-rank {
      font-weight: 900;
      text-align: left;
    }
    .lb-name {
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-score {
      text-align: right;
      font-weight: 800;
      font-family: monospace;
      font-size: 14px;
    }

    .lb-empty {
      padding: 16px;
      font-size: 13px;
      color: #9f91bf;
    }

    .start-button {
      border: 0;
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #ff2bd6, #813cff 50%, #21f6ff);
      box-shadow:
        0 0 16px rgba(255,43,214,.45),
        0 0 30px rgba(33,246,255,.20);
      padding: 12px 28px;
      min-width: 190px;
      align-self: center;
      border-radius: 999px;
      font-size: clamp(16px, 3vw, 19px);
      transition: transform .15s ease, filter .15s ease;
    }

    .start-button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.12);
    }

    .start-button:active {
      transform: scale(.98);
    }

    .hint {
      font-size: 12px;
      opacity: .72;
      line-height: 1.5;
    }

    /* 手機版專屬觸控方向鍵（SVG 防文字選取、加大按鍵面積） */
    .mobile-controls {
      width: 100%;
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 4px;
      -webkit-user-select: none;
      user-select: none;
    }

    .touch-button {
      min-height: 62px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(180deg, rgba(28, 10, 52, 0.96), rgba(11, 2, 24, 0.96));
      border: 1.5px solid rgba(33, 246, 255, 0.35);
      color: #fef7ff;
      box-shadow:
        0 0 15px rgba(255,43,214,.15),
        inset 0 0 12px rgba(33,246,255,.06);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
    }

    .touch-button svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(33, 246, 255, 0.6));
    }

    .touch-button.active {
      background: linear-gradient(135deg, rgba(255,43,214,.62), rgba(33,246,255,.38));
      border-color: var(--cyan);
      box-shadow:
        0 0 20px rgba(255,43,214,.45),
        0 0 24px rgba(33,246,255,.25);
      transform: translateY(1px);
    }

    .status {
      min-height: 18px;
      text-align: center;
      font-size: 12px;
      opacity: .75;
      letter-spacing: .05em;
    }

    /* 手機直向版面放大優化 */
    @media (max-width: 768px) {
      .game-shell {
        width: 96vw;
        height: 100dvh;
        padding: 52px 4px 12px;
        justify-content: space-between;
        gap: 8px;
      }

      .topbar {
        gap: 6px;
      }

      .score-card {
        padding: 6px 10px;
        border-radius: 12px;
      }

      .title {
        font-size: clamp(16px, 4.5vw, 22px);
        letter-spacing: .08em;
        margin-left: .08em;
      }

      /* 在手機直向模式下，將畫布比例調整為直向 4:5，讓遊戲畫面大幅放大且不變形 */
      .canvas-wrap {
        aspect-ratio: 4 / 5;
        max-height: 64dvh;
        width: auto;
        max-width: 100%;
        border-radius: 16px;
      }

      canvas {
        border-radius: 14px;
      }

      .mobile-controls {
        display: grid;
      }

      .status {
        display: none;
      }
    }

    @media (max-height: 700px) and (min-width: 769px) {
      .game-shell {
        transform: scale(.92);
      }
    }
  </style>
</head>
<body>
  <a class="home-link" href="index.html">← 回首頁</a>

  <main class="game-shell" aria-label="霓虹乒乓遊戲">
    <div class="topbar">
      <div class="score-card left">
        <span class="score-label">本局得分</span>
        <span id="playerScore" class="score-value">0</span>
      </div>

      <div class="title">NEON PONG</div>

      <div class="score-card right">
        <span class="score-label">最高紀錄</span>
        <span id="bestScore" class="score-value">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" aria-label="Pong 遊戲畫面"></canvas>
    </div>

    <!-- 手機雙大尺寸 SVG 方向鍵（徹底防止被當成文字選取） -->
    <div class="mobile-controls" oncontextmenu="return false;">
      <button class="touch-button" data-action="left" type="button" aria-label="向左移動">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
        </svg>
      </button>
      <button class="touch-button" data-action="right" type="button" aria-label="向右移動">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
        </svg>
      </button>
    </div>

    <div id="status" class="status">準備就緒</div>
  </main>

  <!-- 全螢幕獨立彈窗：手機與電腦都能看清楚完整排行榜與輸入框 -->
  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlayTitle">霓虹乒乓</h1>
      <p id="overlayText">接住球，讓它不要越過你的球拍！</p>
      <div class="result" id="resultText"></div>

      <!-- 成績上傳區塊 -->
      <div id="submitBox" class="submit-box hidden">
        <div class="input-group">
          <input type="text" id="nicknameInput" class="nickname-input" placeholder="輸入玩家暱稱" maxlength="10">
          <button id="submitScoreBtn" class="submit-btn" type="button">上傳排行榜</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
      </div>

      <!-- 雲端排行榜區塊 -->
      <div class="leaderboard-panel">
        <div class="lb-header">
          <span>🏆 全球前 10 名排行榜</span>
          <button id="refreshBtn" class="refresh-btn" type="button" title="重新整理">🔄 重整</button>
        </div>
        <div id="lbList" class="lb-list">
          <div class="lb-empty">排行榜讀取中...</div>
        </div>
      </div>

      <button id="startButton" class="start-button" type="button">開始遊戲</button>
      <div class="hint">
        電腦：← → 移動球拍・空白鍵開始遊戲<br>
        手機：按住下方左右方向鍵移動球拍
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      // Google Apps Script 雲端排行榜 API 網址
      const API_URL = "https://script.google.com/macros/s/AKfycbyqzsUAy66OKoO-taPSPiSqB40ZQzuvYHNft2NO8hJLkVdJxKaPharuLHV31udWXaQKew/exec";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const playerScoreEl = document.getElementById("playerScore");
      const bestScoreEl = document.getElementById("bestScore");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const resultText = document.getElementById("resultText");
      const startButton = document.getElementById("startButton");
      const statusEl = document.getElementById("status");

      // 排行榜相關 DOM
      const submitBox = document.getElementById("submitBox");
      const nicknameInput = document.getElementById("nicknameInput");
      const submitScoreBtn = document.getElementById("submitScoreBtn");
      const statusMsg = document.getElementById("statusMsg");
      const lbList = document.getElementById("lbList");
      const refreshBtn = document.getElementById("refreshBtn");

      const STORAGE_KEY = "neonPongBestScore";
      const NAME_STORAGE_KEY = "neonPongPlayerName";

      // 預載上次使用的玩家名稱
      const savedName = localStorage.getItem(NAME_STORAGE_KEY) || "";
      if (savedName) nicknameInput.value = savedName;

      // 遊戲世界邏輯座標（高度固定 675 確保跨裝置球速一致，寬度隨桌面 16:9 或手機 4:5 自動調整）
      let WORLD_W = 1200;
      const WORLD_H = 675;

      const player = {
        x: WORLD_W / 2 - 70,
        y: WORLD_H - 42,
        w: 140,
        h: 14,
        speed: 760
      };

      const enemy = {
        x: WORLD_W / 2 - 70,
        y: 28,
        w: 140,
        h: 14,
        speed: 430
      };

      const ball = {
        x: WORLD_W / 2,
        y: WORLD_H / 2,
        r: 9,
        vx: 0,
        vy: 0,
        baseSpeed: 390, // 調降初始球速，讓開局更容易反應
        maxSpeed: 920
      };

      let score = 0;
      let bestScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
      let running = false;
      let gameOver = false;
      let lastTime = 0;

      // 發球緩衝倒數計時器（秒），大於 0 時球停留在中央並顯示預備倒數
      let serveDelayTimer = 0;

      // 柔和擊球波紋特效（取代刺眼的全畫面閃白光）
      const ripples = [];

      const keys = {
        left: false,
        right: false
      };

      bestScoreEl.textContent = bestScore;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resizeCanvas() {
        const isMobilePortrait = window.innerWidth <= 768;
        const nextWorldW = isMobilePortrait ? 540 : 1200; // 540:675 = 4:5 比例，1200:675 = 16:9 比例

        if (nextWorldW !== WORLD_W) {
          const ratio = nextWorldW / WORLD_W;
          WORLD_W = nextWorldW;
          player.w = isMobilePortrait ? 116 : 140;
          enemy.w = isMobilePortrait ? 116 : 140;
          player.x = clamp(player.x * ratio, 20, WORLD_W - player.w - 20);
          enemy.x = clamp(enemy.x * ratio, 20, WORLD_W - enemy.w - 20);
          ball.x = clamp(ball.x * ratio, 24, WORLD_W - 24);
        }

        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        ctx.setTransform(canvas.width / WORLD_W, 0, 0, canvas.height / WORLD_H, 0, 0);
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // ==================== 排行榜 API 邏輯 ====================
      async function fetchLeaderboard() {
        lbList.innerHTML = `<div class="lb-empty">排行榜更新中...</div>`;
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (data && data.success && Array.isArray(data.leaderboard)) {
            renderLeaderboard(data.leaderboard);
          } else {
            lbList.innerHTML = `<div class="lb-empty">目前尚無排名資料</div>`;
          }
        } catch (err) {
          console.error("載入排行榜失敗:", err);
          lbList.innerHTML = `<div class="lb-empty" style="color:#ff6b8b">無法連接排行榜伺服器</div>`;
        }
      }

      function renderLeaderboard(list) {
        if (!list || list.length === 0) {
          lbList.innerHTML = `<div class="lb-empty">目前尚無玩家紀錄，搶先挑戰！</div>`;
          return;
        }

        lbList.innerHTML = list.map((item, index) => {
          const rank = index + 1;
          const topClass = rank === 1 ? "top-1" : rank === 2 ? "top-2" : rank === 3 ? "top-3" : "";
          const medal = rank === 1 ? "🥇 " : rank === 2 ? "🥈 " : rank === 3 ? "🥉 " : `#${rank}`;
          return `
            <div class="lb-row ${topClass}">
              <span class="lb-rank">${medal}</span>
              <span class="lb-name" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</span>
              <span class="lb-score">${item.score}</span>
            </div>
          `;
        }).join("");
      }

      async function submitScore() {
        const name = nicknameInput.value.trim();
        if (!name) {
          statusMsg.textContent = "請先輸入玩家暱稱！";
          statusMsg.style.color = "#ff6b8b";
          nicknameInput.focus();
          return;
        }

        localStorage.setItem(NAME_STORAGE_KEY, name);

        submitScoreBtn.disabled = true;
        statusMsg.textContent = "正在上傳成績到雲端...";
        statusMsg.style.color = "var(--cyan)";

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              name: name,
              score: score
            })
          });

          const result = await res.json();
          if (result && result.success) {
            statusMsg.textContent = "✅ 成績已成功登錄！";
            statusMsg.style.color = "#4cff91";
            fetchLeaderboard();
          } else {
            statusMsg.textContent = "上傳失敗：" + (result.message || "未知錯誤");
            statusMsg.style.color = "#ff6b8b";
            submitScoreBtn.disabled = false;
          }
        } catch (err) {
          console.error("上傳失敗:", err);
          statusMsg.textContent = "伺服器連線異常，請稍候重試";
          statusMsg.style.color = "#ff6b8b";
          submitScoreBtn.disabled = false;
        }
      }

      function escapeHTML(str) {
        return String(str).replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      submitScoreBtn.addEventListener("click", submitScore);
      refreshBtn.addEventListener("click", fetchLeaderboard);

      // ==================== 遊戲核心邏輯 ====================
      function addRipple(x, y, color) {
        ripples.push({ x, y, r: 8, maxR: 48, alpha: 0.75, color });
      }

      // 設定發球與緩衝時間（delay 秒後球才會正式發射）
      function prepareBall(direction = 1, delay = 1.5) {
        ball.x = WORLD_W / 2;
        ball.y = WORLD_H / 2;
        const angle = (Math.random() * 0.65 - 0.325);
        const speed = ball.baseSpeed + Math.min(score * 10, 210);
        ball.vx = Math.sin(angle) * speed;
        ball.vy = direction * Math.cos(angle) * speed;
        serveDelayTimer = delay;
      }

      function resetGame() {
        resizeCanvas();
        score = 0;
        player.x = WORLD_W / 2 - player.w / 2;
        enemy.x = WORLD_W / 2 - enemy.w / 2;
        ripples.length = 0;
        gameOver = false;
        running = true;
        playerScoreEl.textContent = score;
        overlay.classList.add("hidden");
        statusEl.textContent = "準備接球...";
        // 開局給予 1.5 秒緩衝時間讓玩家看清楚球並移動球拍
        prepareBall(1, 1.5);
      }

      function endGame() {
        running = false;
        gameOver = true;

        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem(STORAGE_KEY, String(bestScore));
          bestScoreEl.textContent = bestScore;
        }

        overlayTitle.textContent = "遊戲結束";
        overlayText.textContent = "球越過你的球拍了！";
        resultText.innerHTML = `本局分數：<b>${score}</b> 歷史最佳：<b>${bestScore}</b>`;
        
        submitBox.classList.remove("hidden");
        submitScoreBtn.disabled = false;
        statusMsg.textContent = "";

        startButton.textContent = "再玩一次";
        overlay.classList.remove("hidden");
        statusEl.textContent = "按空白鍵或點擊再玩一次";

        fetchLeaderboard();
      }

      function startFromOverlay() {
        overlayTitle.textContent = "霓虹乒乓";
        overlayText.textContent = "接住球，讓它不要越過你的球拍！";
        resultText.textContent = "";
        submitBox.classList.add("hidden");
        startButton.textContent = "開始遊戲";
        resetGame();
      }

      function movePaddles(dt) {
        if (keys.left) player.x -= player.speed * dt;
        if (keys.right) player.x += player.speed * dt;
        player.x = clamp(player.x, 20, WORLD_W - player.w - 20);

        const target = ball.x - enemy.w / 2;
        const diff = target - enemy.x;
        const aiSpeed = enemy.speed + Math.min(score * 8, 210);
        const step = clamp(diff, -aiSpeed * dt, aiSpeed * dt);
        enemy.x = clamp(enemy.x + step, 20, WORLD_W - enemy.w - 20);
      }

      function paddleCollision(pad, movingDown) {
        const hitsX = ball.x + ball.r > pad.x && ball.x - ball.r < pad.x + pad.w;
        const hitsY = movingDown
          ? ball.y + ball.r >= pad.y && ball.y < pad.y + pad.h
          : ball.y - ball.r <= pad.y + pad.h && ball.y > pad.y;

        return hitsX && hitsY;
      }

      function bounceFromPaddle(pad, movingDown) {
        const hit = (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2);
        const clampedHit = clamp(hit, -1, 1);

        let speed = Math.hypot(ball.vx, ball.vy);
        speed = Math.min(speed * 1.045 + 6, ball.maxSpeed);

        const angle = clampedHit * 0.92;
        const nextVx = Math.sin(angle) * speed;
        const nextVy = Math.cos(angle) * speed * (movingDown ? -1 : 1);

        ball.vx = nextVx;
        ball.vy = nextVy;

        ball.y = movingDown
          ? pad.y - ball.r - 0.5
          : pad.y + pad.h + ball.r + 0.5;

        // 局部柔和光圈波紋，不閃爍全螢幕
        addRipple(ball.x, ball.y, movingDown ? "#21f6ff" : "#ff2bd6");
      }

      function update(dt) {
        // 更新波紋動畫
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += 140 * dt;
          rp.alpha -= 1.8 * dt;
          if (rp.alpha <= 0) ripples.splice(i, 1);
        }

        if (!running) return;

        // 緩衝期間仍可自由移動球拍準備接球
        movePaddles(dt);

        if (serveDelayTimer > 0) {
          serveDelayTimer = Math.max(0, serveDelayTimer - dt);
          if (serveDelayTimer === 0) {
            statusEl.textContent = "遊戲中";
          }
          return;
        }

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.x - ball.r <= 14) {
          ball.x = 14 + ball.r;
          ball.vx = Math.abs(ball.vx);
        } else if (ball.x + ball.r >= WORLD_W - 14) {
          ball.x = WORLD_W - 14 - ball.r;
          ball.vx = -Math.abs(ball.vx);
        }

        if (ball.vy < 0 && paddleCollision(enemy, false)) {
          bounceFromPaddle(enemy, false);
        }

        if (ball.vy > 0 && paddleCollision(player, true)) {
          score += 1;
          playerScoreEl.textContent = score;

          if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          }

          bounceFromPaddle(player, true);
        }

        if (ball.y - ball.r > WORLD_H + 12) {
          endGame();
          return;
        }

        // 球越過敵方底線：得分並給予 1.0 秒發球緩衝
        if (ball.y + ball.r < -12) {
          score += 1;
          playerScoreEl.textContent = score;

          if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem(STORAGE_KEY, String(bestScore));
          }

          addRipple(ball.x, 20, "#ffd23f");
          prepareBall(1, 1.0);
        }
      }

      function glowCircle(x, y, radius, colorA, colorB) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, radius * 4);
        g.addColorStop(0, colorA);
        g.addColorStop(0.25, colorB);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, radius * 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBackground() {
        const bg = ctx.createLinearGradient(0, 0, 0, WORLD_H);
        bg.addColorStop(0, "#080013");
        bg.addColorStop(0.55, "#10001c");
        bg.addColorStop(1, "#04000a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        ctx.save();
        ctx.setLineDash([14, 16]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 43, 214, .42)";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff2bd6";
        ctx.beginPath();
        ctx.moveTo(24, WORLD_H / 2);
        ctx.lineTo(WORLD_W - 24, WORLD_H / 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(33, 246, 255, .45)";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#21f6ff";
        ctx.strokeRect(14, 14, WORLD_W - 28, WORLD_H - 28);
        ctx.restore();
      }

      function drawRipples() {
        for (const rp of ripples) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = rp.color;
          ctx.globalAlpha = Math.max(0, rp.alpha);
          ctx.lineWidth = 2.5;
          ctx.shadowBlur = 10;
          ctx.shadowColor = rp.color;
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawPaddle(pad, mainColor, glowColor) {
        const gradient = ctx.createLinearGradient(pad.x, pad.y, pad.x + pad.w, pad.y);
        gradient.addColorStop(0, mainColor);
        gradient.addColorStop(0.5, "#ffffff");
        gradient.addColorStop(1, mainColor);

        ctx.save();
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 20;
        ctx.shadowColor = glowColor;
        ctx.beginPath();
        ctx.roundRect(pad.x, pad.y, pad.w, pad.h, 7);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.fillRect(pad.x + 12, pad.y + 3, pad.w - 24, 2);
        ctx.restore();
      }

      function drawBall() {
        glowCircle(ball.x, ball.y, ball.r, "rgba(255,255,255,.85)", "rgba(33,246,255,.22)");

        ctx.save();
        const g = ctx.createRadialGradient(
          ball.x - 2, ball.y - 2, 1,
          ball.x, ball.y, ball.r
        );
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.5, "#e8ffff");
        g.addColorStop(1, "#21f6ff");
        ctx.fillStyle = g;
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#21f6ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawServeCountdown() {
        if (!running || serveDelayTimer <= 0) return;

        ctx.save();
        // 顯示發球方向預示虛線
        const dirLen = 46;
        const speed = Math.hypot(ball.vx, ball.vy) || 1;
        const dx = (ball.vx / speed) * dirLen;
        const dy = (ball.vy / speed) * dirLen;

        ctx.strokeStyle = "rgba(33, 246, 255, 0.75)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + dx, ball.y + dy);
        ctx.stroke();

        // 顯示收縮光環與 READY 倒數文字
        const ringRadius = 16 + serveDelayTimer * 22;
        ctx.setLineDash([]);
        ctx.strokeStyle = "rgba(255, 210, 63, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ringRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.font = "900 26px sans-serif";
        ctx.fillStyle = "#ffd23f";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff2bd6";
        const countNum = Math.ceil(serveDelayTimer * 2);
        ctx.fillText(`READY ${countNum}`, WORLD_W / 2, WORLD_H / 2 - 38);
        ctx.restore();
      }

      function draw() {
        drawBackground();
        drawRipples();
        drawPaddle(enemy, "#ff2bd6", "#ff2bd6");
        drawPaddle(player, "#21f6ff", "#21f6ff");
        drawBall();
        drawServeCountdown();
      }

      function frame(time) {
        if (!lastTime) lastTime = time;
        const dt = Math.min((time - lastTime) / 1000, 0.033);
        lastTime = time;

        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      // 監聽鍵盤事件（進行中按空白鍵不再重置球的位置）
      window.addEventListener("keydown", (event) => {
        if (event.target.tagName === "INPUT") return;

        if (event.code === "ArrowLeft" || event.code === "ArrowRight" || event.code === "Space") {
          event.preventDefault();
        }

        if (event.code === "ArrowLeft") keys.left = true;
        if (event.code === "ArrowRight") keys.right = true;

        // 僅在非遊戲進行中才允許空白鍵啟動遊戲
        if (event.code === "Space" && !event.repeat && !running) {
          startFromOverlay();
        }
      });

      window.addEventListener("keyup", (event) => {
        if (event.target.tagName === "INPUT") return;
        if (event.code === "ArrowLeft") keys.left = false;
        if (event.code === "ArrowRight") keys.right = false;
      });

      startButton.addEventListener("click", startFromOverlay);

      // 手機觸控按鈕（阻擋所有選字與長按選單行為）
      document.querySelectorAll(".touch-button").forEach((button) => {
        const action = button.dataset.action;

        const press = (event) => {
          event.preventDefault();
          button.classList.add("active");
          if (action === "left") keys.left = true;
          if (action === "right") keys.right = true;
        };

        const release = (event) => {
          event.preventDefault();
          button.classList.remove("active");
          if (action === "left") keys.left = false;
          if (action === "right") keys.right = false;
        };

        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
        button.addEventListener("selectstart", (e) => e.preventDefault());
        button.addEventListener("contextmenu", (e) => e.preventDefault());
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          keys.left = false;
          keys.right = false;
        }
      });

      // 初始化畫面與排行榜
      overlay.classList.remove("hidden");
      overlayTitle.textContent = "霓虹乒乓";
      overlayText.textContent = "接住球，讓它不要越過你的球拍！";
      resultText.textContent = "";
      statusEl.textContent = "準備就緒";
      prepareBall(1, 1.5);
      draw();
      fetchLeaderboard();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
